name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Real registry check (should pass)
        run: node bin/installguard.js check express npm:lodash pypi:requests
      - name: Hallucinated package (should be caught)
        run: |
          if node bin/installguard.js check pypi:reqeusts; then
            echo "expected installguard to flag reqeusts" && exit 1
          fi
      - name: Download counts are reachable
        run: |
          node bin/installguard.js check --json express pypi:requests > out.json
          node -e '
            const r = require("./out.json");
            for (const p of r) console.log(p.ecosystem, p.name, p.weeklyDownloads);
            const npm = r.find(p => p.ecosystem === "npm");
            if (!(npm.weeklyDownloads > 0)) { console.error("npm download count missing"); process.exit(1); }
            const py = r.find(p => p.ecosystem === "pypi");
            if (!(py.weeklyDownloads > 0)) console.log("::warning::PyPI download count unavailable (pypistats is best-effort)");'
